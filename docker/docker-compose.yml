version: "3.8"

include:
    - ./judge0/docker-compose.yml
    - ./nginx/docker-compose.yml

services:
    redis:
        container_name: redis
        image: redis:alpine
        restart: always
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data

    production:
        container_name: production
        image: boilerexams/backend:production
        env_file:
            - .env.production
        restart: always
        ports:
            - "8080:8080"
        network_mode: host
        depends_on:
            - redis
        volumes:
            - /etc/letsencrypt:/etc/letsencrypt:ro

    development:
        container_name: development
        image: boilerexams/backend:development
        env_file:
            - .env.development
        restart: always
        ports:
            - "8081:8081"
        network_mode: host
        depends_on:
            - redis
        volumes:
            - /etc/letsencrypt:/etc/letsencrypt:ro

    canary:
        container_name: canary
        image: boilerexams/backend:canary
        env_file:
            - .env.canary
        restart: always
        ports:
            - "8082:8082"
        network_mode: host
        depends_on:
            - redis
        volumes:
            - /etc/letsencrypt:/etc/letsencrypt:ro
