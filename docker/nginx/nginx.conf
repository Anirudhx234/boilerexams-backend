events {
  worker_connections 1024;
}

http {
  limit_req_zone $limit_key zone=api:5m rate=1r/s;
  limit_req_status 429;

  geo $limit {
    default 1;
    178.128.158.20 0;
    73.103.19.222 0;
  }

  map $limit $limit_key {
    0 "";
    1 $binary_remote_addr;
  }

  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name  api.boilerexams.com;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_header  Authorization;

    location / {
      proxy_pass http://host.docker.internal:8080/;
    }

    location /dev/ {
      proxy_pass http://host.docker.internal:8081/;
    }

    location /run/ {
      limit_req zone=api burst=1 nodelay;
      proxy_pass http://host.docker.internal:2358/;
    }

    location ~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    ssl_certificate /etc/letsencrypt/live/api.boilerexams.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.boilerexams.com/privkey.pem;
  }

  server {
    listen 80;
    listen [::]:80;
    server_name  api.boilerexams.com;
  
    if ($host = api.boilerexams.com) {
      return 301 https://$host$request_uri;
    }
    return 404;
  }

  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name  analytics.boilerexams.com;
  
    location / {
      proxy_pass http://host.docker.internal:3000;
    }

    location ~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
  
    ssl_certificate /etc/letsencrypt/live/analytics.boilerexams.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.boilerexams.com/privkey.pem;
  }
  
  server {
    listen 80;
    listen [::]:80;
    server_name  analytics.boilerexams.com;
  
    if ($host = analytics.boilerexams.com) {
      return 301 https://$host$request_uri;
    }
    return 404;
  }
}