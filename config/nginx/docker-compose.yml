version: "3.8"

services:
  nginx:
    container_name: nginx
    image: nginx:latest
    restart: always
    ports:
     - "80:80"
     - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf/:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
  
  certbot:
    container_name: certbot
    image: certbot/certbot:latest
    volumes:
      - ./certbot/conf/:/etc/letsencrypt
      - ./certbot/www/:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot --force-renewal --email boilerexams@gmail.com -d api.boilerexams.com -d analytics.boilerexams.com --agree-tos
    