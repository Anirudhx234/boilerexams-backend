name: Deploy API to Docker Hub and Beast - Development

on:
    push:
        branches:
            - "dev"

jobs:
    deploy:
        runs-on: self-hosted
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./docker/Dockerfile.development
                  push: true
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend:development
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Pull Image and Start Container
              working-directory: /home/boilerexams/docker
              run: |
                  docker pull ${{ secrets.DOCKERHUB_USERNAME }}/backend:development
                  docker compose down development -t 30
                  docker compose up development -d
