name: Deploy API to EC2 - Development

on:
  push:
    branches:
      - "dev"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
      DATABASE_URL_BOUNCER: ${{ secrets.DATABASE_URL_BOUNCER_DEV }}

    steps:
      - run: cd /home/ec2-user/docker
      - run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/boilerexams-backend:development
      - run: docker compose down development
      - run: docker compose up development -d
