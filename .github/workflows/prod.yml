name: Deploy API to Docker Hub and EC2 - Production

on:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.production
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/boilerexams-backend:production

  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull Image and Start Container
        working-directory: /home/ec2-user/docker
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/boilerexams-backend:production
          docker compose down production
          docker compose up production -d
