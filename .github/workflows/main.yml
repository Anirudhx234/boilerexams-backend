name: Deploy API to EC2

on:
  push:
    branches: [ main ]

  workflow_dispatch:

jobs:
  deploy:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_BOUNCER: ${{ secrets.DATABASE_URL_BOUNCER }}

    steps:
      - uses: actions/checkout@v3

      - run: npm ci
      - run: npm run deploy
      # - run:
      #     echo "::set-env name=DATABASE_URL::${{ secrets.DATABASE_URL_DEV }}"
      #     echo "::set-env name=DATABASE_URL_BOUNCER::${{ secrets.DATABASE_URL_BOUNCER_DEV }}"
      # - run: npm run deploy
      - run: npm run build

      - name: rsync deployments
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete
          path: ./*
          remote_path: /home/ec2-user/boilerexams-backend
          remote_host: ${{ secrets.HOST }}
          remote_user: ${{ secrets.USER }}
          remote_key: ${{ secrets.SSH_KEY }}
